<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDR Lite - Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0a0a0a; color: #e0e0e0; }
        .header {
            background: linear-gradient(135deg, #0a0a0a 0%, #0d1117 100%);
            border-bottom: 1px solid #0066ff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo h1 { color: #0066ff; font-size: 24px; }
        .logo span { color: #00aaff; font-size: 12px; }
        .user-info { display: flex; align-items: center; gap: 20px; }
        .user-name { color: #00aaff; }
        .logout-btn {
            background: #1a1a2e; color: #ff6b6b; padding: 8px 20px;
            border-radius: 8px; text-decoration: none; border: 1px solid #ff6b6b; cursor: pointer;
        }
        .logout-btn:hover { background: #ff6b6b; color: white; }
        .container { max-width: 1400px; margin: 0 auto; padding: 30px; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: #0d1117; border: 1px solid #0066ff; border-radius: 15px;
            padding: 25px; text-align: center; transition: transform 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,102,255,0.2); }
        .stat-number { font-size: 48px; font-weight: bold; color: #0066ff; }
        .stat-label { color: #888; margin-top: 10px; font-size: 14px; }
        .threats-section { background: #0d1117; border: 1px solid #0066ff; border-radius: 15px; padding: 20px; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #0066ff; }
        .section-header h2 { color: #0066ff; }
        .clear-btn { background: #1a1a2e; color: #ff6b6b; padding: 8px 20px; border: 1px solid #ff6b6b; border-radius: 8px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 15px; background: #0a0a0a; color: #00aaff; border-bottom: 1px solid #0066ff; }
        td { padding: 12px 15px; border-bottom: 1px solid #1a1a2e; }
        .severity-CRITICAL { color: #ff6b6b; font-weight: bold; }
        .severity-HIGH { color: #ffa500; font-weight: bold; }
        .severity-MEDIUM { color: #ffd700; }
        .process-name { font-family: monospace; color: #00aaff; }
        .live-badge { background: #0066ff; color: white; padding: 4px 12px; border-radius: 20px; font-size: 11px; animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background: #0066ff; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <h1>🛡️ EDR LITE <span>Endpoint Detection & Response</span></h1>
        </div>
        <div class="user-info">
            <span class="user-name" id="username">👤 Loading...</span>
            <span class="live-badge">● LIVE</span>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>
    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-number" id="totalThreats">0</div><div class="stat-label">Total Threats</div></div>
            <div class="stat-card"><div class="stat-number" id="criticalThreats">0</div><div class="stat-label">Critical</div></div>
            <div class="stat-card"><div class="stat-number" id="highThreats">0</div><div class="stat-label">High</div></div>
            <div class="stat-card"><div class="stat-number" id="mediumThreats">0</div><div class="stat-label">Medium</div></div>
        </div>
        <div class="threats-section">
            <div class="section-header">
                <h2>📋 Detected Threats</h2>
                <button class="clear-btn" onclick="clearThreats()">Clear All</button>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead><tr><th>Time</th><th>Process</th><th>Type</th><th>Severity</th><th>Reason</th><th>Action</th></tr></thead>
                    <tbody id="threatsBody"><tr><td colspan="6" style="text-align:center;">Loading...</td></tr></tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        async function loadUser() {
            try {
                const res = await fetch('/api/stats', { headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` } });
                if (res.ok) { const data = await res.json(); document.getElementById('username').innerHTML = `👤 ${data.username}`; }
                else if (res.status === 401) await refreshToken();
            } catch(e) {}
        }
        async function loadThreats() {
            try {
                const res = await fetch('/api/threats', { headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` } });
                if (res.ok) {
                    const data = await res.json();
                    const tbody = document.getElementById('threatsBody');
                    if (data.threats.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">✅ No threats detected</td></tr>'; return; }
                    tbody.innerHTML = data.threats.map(t => `<tr><td>${new Date(t.timestamp).toLocaleTimeString()}</td><td class="process-name">${t.process_name}</td><td>${t.detection_type || 'Threat'}</td><td class="severity-${t.severity}">${t.severity}</td><td>${t.reason.substring(0,60)}</td><td>🔒 ${t.action_taken}</td></tr>`).join('');
                }
            } catch(e) {}
        }
        async function loadStats() {
            try {
                const res = await fetch('/api/stats', { headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` } });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('totalThreats').textContent = data.total;
                    document.getElementById('criticalThreats').textContent = data.critical;
                    document.getElementById('highThreats').textContent = data.high;
                    document.getElementById('mediumThreats').textContent = data.medium;
                }
            } catch(e) {}
        }
        async function clearThreats() {
            if (confirm('Clear all threat logs?')) {
                await fetch('/api/threats/clear', { method: 'POST', headers: { 'Authorization': `Bearer ${localStorage.getItem('access_token')}` } });
                loadThreats(); loadStats();
            }
        }
        async function refreshToken() {
            const rt = localStorage.getItem('refresh_token');
            if (!rt) { window.location.href = '/'; return; }
            const res = await fetch('/api/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: rt }) });
            if (res.ok) { const data = await res.json(); localStorage.setItem('access_token', data.access_token); loadUser(); loadThreats(); loadStats(); }
            else { window.location.href = '/'; }
        }
        function logout() { localStorage.clear(); window.location.href = '/'; }
        if (!localStorage.getItem('access_token')) window.location.href = '/';
        loadUser(); loadThreats(); loadStats();
        setInterval(() => { loadThreats(); loadStats(); }, 5000);
    </script>
</body>
</html>
